<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Drashtu ❤️ Yash</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Comic Sans MS', cursive;
            overflow: hidden;
        }

        .container {
            background: white;
            padding: 35px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        h1 {
            color: #ff4d6d;
            font-size: 30px;
            margin-bottom: 25px;
        }

        p {
            font-size: 18px;
            margin-bottom: 20px;
        }

        button {
            padding: 14px 28px;
            font-size: 20px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            margin: 10px;
        }

        #yes {
            background-color: #ff4d6d;
            color: white;
        }

        #no {
            background-color: #ddd;
            position: absolute;
        }

        .heart {
            position: absolute;
            font-size: 20px;
            animation: float 4s infinite ease-in;
            opacity: 0.7;
        }

        @keyframes float {
            0% { transform: translateY(0); opacity: 0.7; }
            100% { transform: translateY(-800px); opacity: 0; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Drashtuu 💖</h1>
    <img src="propsal.jpg" alt="Us" style="
    width:220px;
    height:auto;
    border-radius:20px;
    margin-bottom:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.25);
">
<p>Will you be my Valentine? 🥺👉👈</p>


    <button id="yes" onclick="yesClicked()">YES 💕</button>
    <button id="no" onmouseover="moveNo()">NO 🙄</button>
</div>

<script>
    function moveNo() {
        const noBtn = document.getElementById("no");
        const x = Math.random() * (window.innerWidth - 100);
        const y = Math.random() * (window.innerHeight - 100);
        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";
    }

    function yesClicked() {
        document.body.innerHTML = `
        <div style="
            height:100vh;
            background:linear-gradient(135deg,#ff758c,#ff7eb3);
            display:flex;
            justify-content:center;
            align-items:center;
            text-align:center;
            font-family:'Comic Sans MS',cursive;
            padding:20px;
            color:white;">
            <div>
    <h1 style="font-size:38px;">YAYYYY 💕💍</h1>

    <img src="memory.jpg" style="
        width:240px;
        border-radius:20px;
        margin:20px 0;
        box-shadow:0 10px 25px rgba(0,0,0,0.3);
    ">

    <p style="font-size:22px;">
        My Drashtuu,<br><br>
        You’re my today,<br>
        my Valentine,<br>
        and my forever ❤️<br><br>
        — Yours, Yash 😘
    </p>
</div>
        </div>
        `;
    }

    // Floating hearts
    setInterval(() => {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * window.innerWidth + "px";
        heart.style.bottom = "0px";
        heart.style.fontSize = Math.random() * 20 + 15 + "px";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 4000);
    }, 300);
</script>

</body>
</html>
